worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    client_max_body_size 200M;
    keepalive_timeout 86400s;

    server {
        listen 80;
        server_name rp-api.vuedapt.com;

        # Proves nginx itself is running. This does not touch gateway-local.
        location = /nginx-health {
            default_type application/json;
            add_header "Access-Control-Allow-Origin" "http://20.196.136.226:5173" always;
            add_header "Access-Control-Allow-Credentials" "true" always;
            add_header "Vary" "Origin" always;
            add_header "X-RP-Gateway-CORS" "nginx-health" always;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        location / {
            if ($request_method = OPTIONS) {
                add_header "Access-Control-Allow-Origin" "http://20.196.136.226:5173" always;
                add_header "Access-Control-Allow-Methods" "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header "Access-Control-Allow-Headers" "Authorization,Content-Type,Accept,Origin,User-Agent,Referer,Host,Cache-Control,Pragma,X-Requested-With" always;
                add_header "Access-Control-Allow-Credentials" "true" always;
                add_header "Access-Control-Max-Age" 1728000 always;
                add_header "Vary" "Origin" always;
                add_header "X-RP-Gateway-CORS" "nginx-options" always;
                return 204;
            }

            proxy_pass http://127.0.0.1:7777;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            send_timeout 86400s;

            # Required for gateway-local streaming keepalive on long tasks.
            proxy_buffering off;
            proxy_request_buffering off;

            # nginx owns browser-facing CORS, so hide upstream CORS duplicates.
            proxy_hide_header "Access-Control-Allow-Origin";
            proxy_hide_header "Access-Control-Allow-Credentials";
            proxy_hide_header "Access-Control-Allow-Methods";
            proxy_hide_header "Access-Control-Allow-Headers";
            proxy_hide_header "Access-Control-Expose-Headers";
            proxy_hide_header "Access-Control-Max-Age";

            add_header "Access-Control-Allow-Origin" "http://20.196.136.226:5173" always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header "Access-Control-Allow-Headers" "Authorization,Content-Type,Accept,Origin,User-Agent,Referer,Host,Cache-Control,Pragma,X-Requested-With" always;
            add_header "Access-Control-Allow-Credentials" "true" always;
            add_header "Access-Control-Max-Age" 1728000 always;
            add_header "Vary" "Origin" always;
            add_header "X-RP-Gateway-CORS" "nginx-location" always;
        }
    }
}
