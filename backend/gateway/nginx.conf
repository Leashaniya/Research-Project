# API Gateway - reverse proxy for microservices
# Routes: /guidance -> academic-guidance, /papers -> model-paper-generation, /mcq -> mcq-study-plan

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100M;
    sendfile on;
    keepalive_timeout 65;

    # Upstream backends
    upstream academic_guidance {
        server academic-guidance:8000;
    }
    upstream model_paper_generation {
        server model-paper-generation:8001;
    }
    upstream mcq_study_plan {
        server mcq-study-plan:8002;
    }

    server {
        listen 80;
        server_name _;

        # Gateway health
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"gateway"}';
            add_header Content-Type application/json;
        }

        # Academic Guidance service (CA guidance, auth, summaries, ER, etc.)
        location /guidance/ {
            rewrite ^/guidance(/.*)$ $1 break;
            proxy_pass http://academic_guidance;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /guidance;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # Model Paper Generation service (past papers, lecture slides, model paper)
        location /papers/ {
            rewrite ^/papers(/.*)$ $1 break;
            proxy_pass http://model_paper_generation;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /papers;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # MCQ Study Plan service
        location /mcq/ {
            rewrite ^/mcq(/.*)$ $1 break;
            proxy_pass http://mcq_study_plan;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /mcq;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # Root - gateway info
        location = / {
            return 200 '{"gateway":"Research Project API","routes":{"health":"/health","guidance":"/guidance/","papers":"/papers/","mcq":"/mcq/"}}';
            add_header Content-Type application/json;
        }
    }
}
